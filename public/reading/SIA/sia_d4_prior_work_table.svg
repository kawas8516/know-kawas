<svg width="100%" viewBox="0 0 640 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Prior-work comparison: which knob does each system turn?</title>
  <desc>Hyperagents, Darwin Gödel Machine, Meta-Harness edit harness only; TTRL, Discover-TTT, STaR edit weights only; SIA edits both</desc>

  <!-- Column header tinted backgrounds -->
  <rect x="344" y="12" width="134" height="28" rx="4" fill="rgb(8,80,65)" fill-opacity="0.4"/>
  <rect x="486" y="12" width="134" height="28" rx="4" fill="rgb(99,56,6)" fill-opacity="0.4"/>

  <!-- Column headers -->
  <text x="172" y="30" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">System</text>
  <text x="411" y="30" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(93,202,165)">Edits Harness</text>
  <text x="553" y="30" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(239,159,39)">Edits Weights</text>

  <!-- Header divider -->
  <line x1="20" y1="45" x2="620" y2="45" stroke="rgb(136,135,128)" stroke-width="0.75"/>

  <!-- Column dividers -->
  <line x1="344" y1="45" x2="344" y2="285" stroke="rgb(68,68,65)" stroke-width="0.5"/>
  <line x1="486" y1="45" x2="486" y2="285" stroke="rgb(68,68,65)" stroke-width="0.5"/>

  <!-- Harness-only rows -->
  <text x="172" y="68" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(250,249,245)">Hyperagents</text>
  <text x="411" y="71" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#1D9E75">✓</text>
  <text x="553" y="68" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(136,135,128)">—</text>

  <text x="172" y="98" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(250,249,245)">Darwin Gödel Machine</text>
  <text x="411" y="101" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#1D9E75">✓</text>
  <text x="553" y="98" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(136,135,128)">—</text>

  <text x="172" y="128" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(250,249,245)">Meta-Harness</text>
  <text x="411" y="131" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#1D9E75">✓</text>
  <text x="553" y="128" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(136,135,128)">—</text>

  <!-- Group separator (dashed) -->
  <line x1="20" y1="145" x2="620" y2="145" stroke="rgb(68,68,65)" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Weights-only rows -->
  <text x="172" y="165" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(250,249,245)">TTRL</text>
  <text x="411" y="165" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(136,135,128)">—</text>
  <text x="553" y="168" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#BA7517">✓</text>

  <text x="172" y="195" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(250,249,245)">Discover-TTT</text>
  <text x="411" y="195" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(136,135,128)">—</text>
  <text x="553" y="198" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#BA7517">✓</text>

  <text x="172" y="225" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(250,249,245)">STaR</text>
  <text x="411" y="225" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" fill="rgb(136,135,128)">—</text>
  <text x="553" y="228" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#BA7517">✓</text>

  <!-- SIA separator -->
  <line x1="20" y1="241" x2="620" y2="241" stroke="rgb(136,135,128)" stroke-width="0.75"/>

  <!-- SIA highlighted row -->
  <rect x="20" y="250" width="600" height="36" rx="6" fill="rgb(28,22,50)" stroke="rgb(175,169,236)" stroke-width="0.75"/>
  <text x="172" y="272" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="13" font-weight="600" fill="rgb(250,249,245)">SIA (ours)</text>
  <text x="411" y="274" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#1D9E75">✓</text>
  <text x="553" y="274" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="16" fill="#BA7517">✓</text>

  <!-- Bottom border -->
  <line x1="20" y1="290" x2="620" y2="290" stroke="rgb(68,68,65)" stroke-width="0.5"/>
</svg>
