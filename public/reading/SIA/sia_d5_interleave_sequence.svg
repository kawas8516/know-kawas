<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>One real SIA run: H-H-H-W-H-W-W interleaved improvement sequence</title>
  <desc>Three harness updates raise the score and plateau; a weight update jumps it higher; harness resumes briefly; two more weight updates push to the final score — showing weight updates do not only fire at the end.</desc>
  <defs>
    <marker id="arrowD5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="60" y1="60" x2="60" y2="280" stroke="rgb(136,135,128)" stroke-width="0.5"/>
  <line x1="60" y1="280" x2="640" y2="280" stroke="rgb(136,135,128)" stroke-width="0.5"/>
  <text x="66" y="52" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">score (higher is better)</text>
  <text x="634" y="298" text-anchor="end" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">generations →</text>

  <!-- Switch markers (dashed verticals) -->
  <!-- First H→W switch (between A₃ and ω₁) -->
  <line x1="340" y1="60" x2="340" y2="280" stroke="rgb(136,135,128)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="340" y="50" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="rgb(194,192,182)">→ weights</text>

  <!-- W→H resume (between ω₁ and A₄) -->
  <line x1="420" y1="60" x2="420" y2="280" stroke="rgb(136,135,128)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="420" y="50" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="rgb(194,192,182)">↩ harness</text>

  <!-- H→W second switch (between A₄ and ω₂) -->
  <line x1="500" y1="60" x2="500" y2="280" stroke="rgb(136,135,128)" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="500" y="50" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="rgb(194,192,182)">→ weights</text>

  <!-- Score line segments — harness (teal) segments -->
  <!-- Initial → A₁ → A₂ → A₃ -->
  <polyline points="60,234 140,208 220,190 300,182" fill="none" stroke="#1D9E75" stroke-width="2"/>
  <!-- A₄ (resume harness after ω₁) -->
  <polyline points="380,152 460,148" fill="none" stroke="#1D9E75" stroke-width="2"/>

  <!-- Weight (amber) segments -->
  <!-- ω₁ -->
  <polyline points="300,182 380,152" fill="none" stroke="#BA7517" stroke-width="2"/>
  <!-- ω₂ → ω₃ -->
  <polyline points="460,148 540,114 620,92" fill="none" stroke="#BA7517" stroke-width="2"/>

  <!-- Harness dots -->
  <circle cx="140" cy="208" r="4" fill="#1D9E75"/>
  <circle cx="220" cy="190" r="4" fill="#1D9E75"/>
  <circle cx="300" cy="182" r="4" fill="#1D9E75"/>
  <circle cx="460" cy="148" r="4" fill="#1D9E75"/>

  <!-- Weight dots -->
  <circle cx="380" cy="152" r="4" fill="#BA7517"/>
  <circle cx="540" cy="114" r="4" fill="#BA7517"/>
  <circle cx="620" cy="92" r="4" fill="#BA7517"/>

  <!-- Generation labels (x-axis) -->
  <text x="140" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">A₁</text>
  <text x="220" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">A₂</text>
  <text x="300" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">A₃</text>
  <text x="380" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">ω₁</text>
  <text x="460" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">A₄</text>
  <text x="540" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">ω₂</text>
  <text x="620" y="298" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">ω₃</text>

  <!-- Sequence label above -->
  <text x="140" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#1D9E75">H</text>
  <text x="220" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#1D9E75">H</text>
  <text x="300" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#1D9E75">H</text>
  <text x="380" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#BA7517">W</text>
  <text x="460" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#1D9E75">H</text>
  <text x="540" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#BA7517">W</text>
  <text x="620" y="268" text-anchor="middle" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="10" fill="#BA7517">W</text>

  <!-- Legend -->
  <rect x="196" y="326" width="12" height="12" rx="2" fill="#1D9E75"/>
  <text x="214" y="337" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">harness update (H)</text>
  <rect x="360" y="326" width="12" height="12" rx="2" fill="#BA7517"/>
  <text x="378" y="337" font-family='"Anthropic Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif' font-size="12" fill="rgb(194,192,182)">weight update (W)</text>
</svg>
