<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-label="VAD-CFR Update Pipeline and Information Flow">
  <defs>
    <linearGradient id="vad-hdr-grey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="vad-hdr-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vad-hdr-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="vad-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="vad-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" rx="14" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">VAD-CFR Update Pipeline &amp; Information Flow</text>
  <text x="450" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">How Volatility-Adaptive Discounted CFR processes regrets and updates policies across iterations</text>

  <!-- ── COL 1: INPUT DATA ── -->
  <g filter="url(#vad-glow)">
    <rect x="20" y="74" width="188" height="424" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="74" width="188" height="36" rx="10" fill="url(#vad-hdr-grey)"/>
    <rect x="20" y="96" width="188" height="14" fill="url(#vad-hdr-grey)"/>
    <text x="114" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">1. INPUT DATA</text>
  </g>
  <!-- Input rows -->
  <rect x="34" y="124" width="160" height="62" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="142" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Instantaneous Regrets</text>
  <text x="44" y="158" font-family="monospace" font-size="9.5" fill="#94a3b8">cfr_regrets (r)</text>

  <rect x="34" y="198" width="160" height="62" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="216" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Iteration Number</text>
  <text x="44" y="232" font-family="monospace" font-size="9.5" fill="#94a3b8">iteration_number (t)</text>

  <rect x="34" y="272" width="160" height="62" rx="7" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="290" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#cbd5e1">Reach Probabilities</text>
  <text x="44" y="306" font-family="monospace" font-size="9.5" fill="#94a3b8">reach_prob (π)</text>

  <!-- Warm-start guard callout -->
  <rect x="34" y="346" width="160" height="82" rx="7" fill="#1c0a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="44" y="364" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fca5a5">Warm-Start Gate</text>
  <text x="44" y="382" font-family="monospace" font-size="9" fill="#f87171">t &lt; 500:</text>
  <text x="44" y="396" font-family="monospace" font-size="9" fill="#f87171">  skip policy update</text>
  <text x="44" y="412" font-family="system-ui,sans-serif" font-size="9" fill="#fca5a5">Regrets still evolve.</text>

  <!-- ── COL 2: REGRET ACCUMULATOR ── -->
  <g filter="url(#vad-glow)">
    <rect x="232" y="74" width="268" height="424" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="232" y="74" width="268" height="36" rx="10" fill="url(#vad-hdr-blue)"/>
    <rect x="232" y="96" width="268" height="14" fill="url(#vad-hdr-blue)"/>
    <text x="366" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">2. REGRET ACCUMULATOR</text>
  </g>

  <!-- Volatility block -->
  <rect x="246" y="124" width="240" height="106" rx="7" fill="#0c1a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="256" y="143" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#93c5fd">Volatility Estimation (EWMA)</text>
  <text x="256" y="160" font-family="monospace" font-size="9" fill="#60a5fa">ewma = 0.1·inst_mag + 0.9·ewma</text>
  <text x="256" y="175" font-family="monospace" font-size="9" fill="#60a5fa">volatility = min(1.0, ewma / 2.0)</text>
  <text x="256" y="190" font-family="monospace" font-size="9" fill="#60a5fa">α, β = f(volatility)</text>
  <text x="256" y="207" font-family="system-ui,sans-serif" font-size="9" fill="#93c5fd">↑ volatility → heavier discounting</text>

  <!-- Asymmetric boosting -->
  <rect x="246" y="242" width="240" height="72" rx="7" fill="#0a1f0a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="256" y="261" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#86efac">Asymmetric Instantaneous Boost</text>
  <text x="256" y="279" font-family="monospace" font-size="9" fill="#4ade80">r_boosted = r × 1.1  if r &gt; 0</text>
  <text x="256" y="294" font-family="monospace" font-size="9" fill="#4ade80">           r        otherwise</text>

  <!-- Sign-dependent discounting -->
  <rect x="246" y="326" width="240" height="152" rx="7" fill="#160e2a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="256" y="346" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#d8b4fe">Sign-Dependent Discounting</text>
  <text x="256" y="365" font-family="monospace" font-size="9" fill="#c4b5fd">if prev_R ≥ 0:</text>
  <text x="270" y="380" font-family="monospace" font-size="9" fill="#c4b5fd">d = t^α / (t^α + 1.0)</text>
  <text x="256" y="396" font-family="monospace" font-size="9" fill="#c4b5fd">else:</text>
  <text x="270" y="411" font-family="monospace" font-size="9" fill="#c4b5fd">d = t^β / (t^β + 1.0)</text>
  <text x="256" y="428" font-family="monospace" font-size="9" fill="#c4b5fd">new_R = prev_R·d + r_boosted</text>
  <text x="256" y="444" font-family="monospace" font-size="9" fill="#e879f9">new_R = max(−20.0, new_R)</text>
  <text x="256" y="460" font-family="system-ui,sans-serif" font-size="9" fill="#d8b4fe">Caps runaway negative regrets.</text>

  <!-- ── COL 3: POLICY ACCUMULATOR ── -->
  <g filter="url(#vad-glow)">
    <rect x="524" y="74" width="356" height="424" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="524" y="74" width="356" height="36" rx="10" fill="url(#vad-hdr-green)"/>
    <rect x="524" y="96" width="356" height="14" fill="url(#vad-hdr-green)"/>
    <text x="702" y="97" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">3. POLICY ACCUMULATOR</text>
  </g>

  <!-- Gate -->
  <rect x="538" y="124" width="328" height="78" rx="7" fill="#1c0a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="548" y="143" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fca5a5">Hard Warm-Start Guard</text>
  <text x="548" y="161" font-family="monospace" font-size="9" fill="#f87171">if iteration_number &lt; 500:</text>
  <text x="562" y="176" font-family="monospace" font-size="9" fill="#f87171">return current_cumulative_policy</text>

  <!-- Multi-factor weighting -->
  <rect x="538" y="216" width="328" height="262" rx="7" fill="#071a17" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="548" y="236" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#5eead4">Regret-Magnitude Weighting  (t ≥ 500)</text>

  <text x="548" y="258" font-family="monospace" font-size="9" fill="#99f6e4"># 1. Temporal weight</text>
  <text x="548" y="272" font-family="monospace" font-size="9" fill="#2dd4bf">w_time = (t + 1.0) ^ γ</text>

  <text x="548" y="294" font-family="monospace" font-size="9" fill="#99f6e4"># 2. High-info boost</text>
  <text x="548" y="308" font-family="monospace" font-size="9" fill="#2dd4bf">w_mag  = (1 + inst_mag/2.0)^0.5</text>

  <text x="548" y="330" font-family="monospace" font-size="9" fill="#99f6e4"># 3. Instability penalty</text>
  <text x="548" y="344" font-family="monospace" font-size="9" fill="#2dd4bf">w_stable = 1 / (1 + inst_mag^1.5)</text>

  <text x="548" y="366" font-family="monospace" font-size="9" fill="#99f6e4"># Composite</text>
  <text x="548" y="380" font-family="monospace" font-size="9" fill="#f0fdfa">weight = w_time × w_mag × w_stable</text>

  <text x="548" y="402" font-family="monospace" font-size="9" fill="#99f6e4"># Update average policy</text>
  <text x="548" y="416" font-family="monospace" font-size="9" fill="#f0fdfa">policy += weight × reach_prob × σ_t</text>

  <line x1="548" y1="432" x2="854" y2="432" stroke="#0d4b44" stroke-width="1"/>
  <text x="548" y="448" font-family="system-ui,sans-serif" font-size="9" fill="#5eead4">High-info, stable iterations dominate the average.</text>
  <text x="548" y="462" font-family="system-ui,sans-serif" font-size="9" fill="#5eead4">Volatile early iterations are down-weighted.</text>

  <!-- ── Arrows between columns ── -->
  <line x1="208" y1="300" x2="228" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#vad-arrow)"/>
  <line x1="500" y1="300" x2="520" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#vad-arrow)"/>
</svg>
